<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>iTimer — OPD / BP Debate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="iTimer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage" id="stage">
    <div class="tilt" id="tilt">
      <div class="timer-wrap">
        <svg class="ring" viewBox="0 0 400 400" aria-hidden="true">
          <circle cx="200" cy="200" r="170" class="track" />
          <circle cx="200" cy="200" r="170" class="progress" id="progress"
                  pathLength="1000"
                  stroke-dasharray="1000"
                  stroke-dashoffset="1000" />
          <circle cx="200" cy="200" r="190" class="overtime" id="overtime"
                  pathLength="1000"
                  stroke-dasharray="1000"
                  stroke-dashoffset="1000" />
          <g class="ticks" id="ticks"></g>
          <g class="markers" id="markers"></g>
        </svg>

        <div class="readout">
          <div class="time" id="time">7:00</div>
          <div class="label" id="label">ready</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="modes" id="modes" role="tablist" aria-label="Timing modes">
        <button class="mode" type="button" data-mode="07:15">07:15</button>
        <button class="mode active" type="button" data-mode="07:00">07:00</button>
        <button class="mode" type="button" data-mode="03:30">03:30</button>
        <button class="mode" type="button" data-mode="01:00">01:00</button>
      </div>

      <div class="controls">
        <button class="btn primary" id="startBtn" type="button">Start</button>
        <button class="btn" id="resetBtn" type="button">Reset</button>
      </div>

      <div class="row">
        <label class="toggle">
          <input type="checkbox" id="soundToggle" checked />
          <span>Sound</span>
        </label>
        <button class="btn ghost small" id="flipBtn" type="button" title="Flip tilt direction">Flip tilt</button>
      </div>

      <div class="row tilt-row">
        <span class="row-label">Tilt <span class="hint">(or 2-finger swipe ↑↓)</span></span>
        <input type="range" id="tiltRange" min="0" max="60" value="35" aria-label="Tilt angle" />
      </div>

      <div class="hint center">Pinch with two fingers to resize the digits</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
