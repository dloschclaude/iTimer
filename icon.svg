<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <!-- faint dial ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#f3f2ed" stroke-opacity="0.10" stroke-width="2"/>
  <!-- minute ticks -->
  <g stroke="#f3f2ed" stroke-linecap="round">
    <g stroke-opacity="0.9" stroke-width="6">
      <line x1="256" y1="96"  x2="256" y2="128"/>
      <line x1="256" y1="384" x2="256" y2="416"/>
      <line x1="96"  y1="256" x2="128" y2="256"/>
      <line x1="384" y1="256" x2="416" y2="256"/>
    </g>
    <g stroke-opacity="0.30" stroke-width="3">
      <line x1="336" y1="117" x2="320" y2="145"/>
      <line x1="395" y1="176" x2="367" y2="192"/>
      <line x1="395" y1="336" x2="367" y2="320"/>
      <line x1="336" y1="395" x2="320" y2="367"/>
      <line x1="176" y1="395" x2="192" y2="367"/>
      <line x1="117" y1="336" x2="145" y2="320"/>
      <line x1="117" y1="176" x2="145" y2="192"/>
      <line x1="176" y1="117" x2="192" y2="145"/>
    </g>
  </g>
  <!-- progress arc (amber) -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#e8a33d" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="640 1168" transform="rotate(-90 256 256)"/>
  <!-- accent second hand -->
  <g transform="rotate(48 256 256)">
    <polygon points="256,116 258.4,256 253.6,256" fill="#e8a33d"/>
    <line x1="256" y1="256" x2="256" y2="296" stroke="#e8a33d" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="256" r="10" fill="#000000" stroke="#e8a33d" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="4.5" fill="#e8a33d"/>
</svg>
